<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" name="viewport"/>
<title>Transfer &amp; Mutasi Antar Akun | Kawaii Pastel Luxe</title>
<!-- Tailwind CSS CDN -->
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<!-- Google Fonts -->
<link href="https://fonts.googleapis.com" rel="preconnect"/>
<link crossorigin="" href="https://fonts.gstatic.com" rel="preconnect"/>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;family=Quicksand:wght@600;700&amp;display=swap" rel="stylesheet"/>
<style data-purpose="custom-theme">
    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-cute {
      font-family: 'Quicksand', cursive, sans-serif;
    }
    /* Hide scrollbars for slick mobile view */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }

      -ms-overflow-style: none;
      scrollbar-width: none;

</head>
<body class="bg-[#fcedd8] min-h-screen flex items-center justify-center p-0 md:p-6 text-slate-800">

<rect height="5" rx="1" width="3" x="2" y="16"></rect>
<rect height="9" rx="1" width="3" x="7" y="12"></rect>
<rect height="13" rx="1" width="3" x="12" y="8"></rect>

<path d="M12 4C7.31 4 3.07 5.9 0 8.98L12 21 24 8.98C20.93 5.9 16.69 4 12 4zm0 3.5c3.55 0 6.77 1.42 9.15 3.73L12 18.47 2.85 11.23C5.23 8.92 8.45 7.5 12 7.5z"></path>
</svg>
<!-- Battery Icon -->
<div class="w-6 h-3 border border-slate-900 rounded-sm p-[1.5px] flex items-center relative">

<div class="w-[2px] h-1.5 bg-slate-900 absolute -right-[3.5px] rounded-r-xs"></div>
</div>

</header>
<!-- END: iOSStatusBar -->

<nav class="px-5 py-2 flex items-center gap-3 z-20" data-purpose="top-navigation">

<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M15 19l-7-7 7-7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Segmented Control Tabs -->
<div class="flex-1 bg-[#efe7db]/70 p-1 rounded-full flex text-xs font-semibold text-stone-600 shadow-inner" data-purpose="segmented-tabs"><button class="flex-1 py-1.5 rounded-full text-stone-500 hover:text-stone-700 text-center transition-all" type="button">Pengeluaran</button>
<button class="flex-1 py-1.5 rounded-full text-stone-500 hover:text-stone-700 text-center transition-all" type="button">Pemasukan</button>
<button class="flex-1 py-1.5 rounded-full bg-white text-purple-950 font-bold shadow-sm text-center transition-all" type="button">Transfer</button></div>
</nav>
<!-- END: TopNavigation -->
<!-- BEGIN: CategoryScrollArea -->
<section class="flex-1 overflow-y-auto px-4 pt-2 pb-56 no-scrollbar" data-purpose="category-grid-section"><div class="flex items-center justify-between mb-2.5 px-1">
<div class="flex items-center gap-1.5">

<span class="text-xs">🔁</span>
</div>
<span class="text-[11px] font-semibold text-purple-800 bg-[#f2e2fc] px-2.5 py-0.5 rounded-full shadow-xs">Internal Transfer</span>
</div>
<!-- Dari Akun (Sumber) -->
<div class="mb-3">
<div class="flex items-center justify-between px-1 mb-1.5">
<span class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Dari Akun (Sumber)</span>
<span class="text-[10px] text-stone-500 font-medium">Saldo Terpilih: Rp 14.200.000</span>
</div>
<div class="grid grid-cols-3 gap-2">
<!-- BCA Selected -->
<button class="flex flex-col p-2.5 rounded-2xl bg-[#f2e2fc] border-2 border-purple-200/60 shadow-sm active:scale-95 transition-all text-left ring-2 ring-purple-200/60" type="button">
<div class="flex items-center justify-between w-full mb-1">
<span class="text-xl drop-shadow-sm">🏦</span>
<span class="w-2 h-2 rounded-full bg-purple-800"></span>
</div>
<span class="text-xs font-bold text-stone-800 leading-tight truncate">BCA Utama</span>
<span class="text-[10px] font-semibold text-stone-500 mt-0.5">Rp 14.200.000</span>
</button>
<!-- Tunai -->
<button class="flex flex-col p-2.5 rounded-2xl bg-[#daf6ea] border border-emerald-100 hover:border-emerald-300 active:scale-95 transition-all text-left" type="button">
<div class="flex items-center justify-between w-full mb-1">
<span class="text-xl drop-shadow-sm">💵</span>
</div>
<span class="text-xs font-bold text-stone-800 leading-tight truncate">Kas / Tunai</span>
<span class="text-[10px] font-semibold text-stone-500 mt-0.5">Rp 750.000</span>
</button>
<!-- Tabungan Impian -->
<button class="flex flex-col p-2.5 rounded-2xl bg-[#fee7d2] border border-orange-100 hover:border-orange-300 active:scale-95 transition-all text-left" type="button">
<div class="flex items-center justify-between w-full mb-1">
<span class="text-xl drop-shadow-sm">🐷</span>
</div>
<span class="text-xs font-bold text-stone-800 leading-tight truncate">Tab. Impian</span>
<span class="text-[10px] font-semibold text-stone-500 mt-0.5">Rp 5.000.000</span>
</button>
</div>
</div>
<!-- Transfer Direction Pill & Divider -->
<div class="flex items-center justify-center my-2">
<div class="flex items-center gap-1.5 px-3 py-1 rounded-full bg-[#fbf6ec]/95 border border-[#eeddc8] shadow-xs text-stone-600">
<span class="text-xs font-bold text-purple-800">⬇️ Pindah Dana Ke</span>
<span class="text-[10px] text-pink-500 bg-pink-50 px-1.5 py-0.5 rounded-full font-bold">Sat-Set ✨</span>
</div>
</div>
<!-- Ke Akun (Tujuan) -->
<div class="mb-3">
<div class="flex items-center justify-between px-1 mb-1.5">
<span class="text-[11px] font-bold uppercase tracking-wider text-stone-400">Ke Akun (Tujuan)</span>
<span class="text-[10px] text-pink-500 font-medium">Celengan Terpilih ✈️</span>
</div>
<div class="grid grid-cols-2 gap-2">
<!-- Celengan Liburan (Selected) -->
<button class="flex items-center gap-2.5 p-2.5 rounded-2xl bg-[#fde1f5] border-2 border-pink-100 shadow-sm active:scale-95 transition-all text-left ring-2 ring-pink-100" type="button">
<span class="text-2xl drop-shadow-sm">🌸</span>
<div class="flex flex-col leading-tight min-w-0">
<span class="text-xs font-bold text-stone-800 truncate">Celengan Liburan</span>
<span class="text-[10px] text-stone-600 font-semibold">Target Rp 20jt</span>
</div>
</button>
<!-- Dompet Kas Harian -->
<button class="flex items-center gap-2.5 p-2.5 rounded-2xl bg-[#feeed1] border border-amber-100 hover:border-amber-300 active:scale-95 transition-all text-left" type="button">
<span class="text-2xl drop-shadow-sm">👛</span>
<div class="flex flex-col leading-tight min-w-0">
<span class="text-xs font-bold text-stone-800 truncate">Kas Harian</span>
<span class="text-[10px] text-stone-600 font-semibold">Rp 1.200.000</span>
</div>
</button>
<!-- Dana Darurat -->
<button class="flex items-center gap-2.5 p-2.5 rounded-2xl bg-[#dcf4fe] border border-sky-100 hover:border-sky-300 active:scale-95 transition-all text-left" type="button">
<span class="text-2xl drop-shadow-sm">🛡️</span>
<div class="flex flex-col leading-tight min-w-0">
<span class="text-xs font-bold text-stone-800 truncate">Dana Darurat</span>
<span class="text-[10px] text-stone-600 font-semibold">Rp 7.500.000</span>
</div>
</button>
<!-- Rekening Bisnis -->
<button class="flex items-center gap-2.5 p-2.5 rounded-2xl bg-[#faeed8] border border-amber-100 hover:border-amber-300 active:scale-95 transition-all text-left" type="button">
<span class="text-2xl drop-shadow-sm">💼</span>
<div class="flex flex-col leading-tight min-w-0">
<span class="text-xs font-bold text-stone-800 truncate">Rek. Bisnis</span>
<span class="text-[10px] text-stone-600 font-semibold">Rp 3.400.000</span>
</div>
</button>
</div>
</div>
<!-- Quick Toggle Bebas Biaya Admin -->
<div class="mt-2 px-1">
<div class="flex items-center justify-between p-2 rounded-2xl bg-[#efe7db]/70 border border-stone-200/40">
<div class="flex items-center gap-2">
<span class="text-sm">✨</span>
<span class="text-[11px] font-semibold text-stone-700">Bebas Biaya Admin (Pencatatan Internal)</span>
</div>
<span class="text-[10px] font-bold text-emerald-800 bg-[#daf6ea] px-2 py-0.5 rounded-full">Rp 0</span>
</div>
</div></section>
<!-- END: CategoryScrollArea -->
<!-- BEGIN: CalculatorAndInputDrawer -->
<!-- Docked Calculator Panel exactly echoing reference layout -->
<div class="absolute bottom-0 left-0 right-0 bg-[#fbf6ec]/95 backdrop-blur-md pt-2 pb-6 px-4 border-t border-[#eeddc8] rounded-t-[36px] shadow-[0_-10px_35px_rgba(0,0,0,0.06)] z-30" data-purpose="calculator-drawer">
<!-- Drawer Pull Handle Indicator -->
<div class="w-10 h-1 bg-stone-300 rounded-full mx-auto mb-2 opacity-60"></div>
<!-- Input Display Bar (Amount + Remark) -->
<div class="grid grid-cols-12 gap-2 mb-2.5 items-stretch" data-purpose="input-preview-bar"><!-- Nominal Transfer Field -->
<div class="col-span-7 bg-[#efe6d5]/70 rounded-2xl px-3.5 py-2 border border-stone-200/50 flex flex-col justify-center">

<div class="flex items-baseline space-x-1">
<span class="text-xs font-bold text-stone-500">Rp</span>
<span class="text-xl font-extrabold text-stone-800 tracking-tight font-cute">500.000</span>
<span class="w-1.5 h-4 bg-pink-400 animate-pulse rounded-full ml-0.5"></span>
</div>
</div>
<!-- Catatan / Remark Display Field -->
<div class="col-span-5 bg-[#efe6d5]/70 rounded-2xl px-3 py-2 border border-stone-200/50 flex flex-col justify-center">
<span class="text-[10px] uppercase font-bold text-stone-400 tracking-wider">Catatan</span>
<input class="bg-transparent border-0 p-0 text-xs font-medium text-stone-700 placeholder:text-stone-400 focus:ring-0 truncate" placeholder="Catatan transfer..." type="text" value="Nabung celengan liburan ✈️"/>
</div></div>
<!-- Numeric Keypad and Quick Ledger Options -->
<div class="grid grid-cols-12 gap-2" data-purpose="keypad-matrix">
<!-- Keypad Numbers & Math (9 columns) -->
<div class="col-span-9 grid grid-cols-4 gap-2 text-stone-800 font-bold" data-purpose="numeric-buttons">
<!-- Row 1 -->
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">1</button>
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">2</button>
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">3</button>
<button class="h-11 rounded-2xl bg-[#ece1cf] hover:bg-[#e4d6bf] text-lg text-stone-700 shadow-sm flex items-center justify-center active:scale-95 transition-all" type="button">＋</button>
<!-- Row 2 -->
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">4</button>
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">5</button>
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">6</button>
<button class="h-11 rounded-2xl bg-[#ece1cf] hover:bg-[#e4d6bf] text-lg text-stone-700 shadow-sm flex items-center justify-center active:scale-95 transition-all" type="button">－</button>
<!-- Row 3 -->
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">7</button>
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">8</button>
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">9</button>
<button aria-label="Hapus Digit" class="h-11 rounded-2xl bg-[#ece1cf] hover:bg-[#e4d6bf] text-stone-700 shadow-sm flex items-center justify-center active:scale-95 transition-all" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewbox="0 0 24 24">
<path d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414A2 2 0 0110.828 5H20a2 2 0 012 2v10a2 2 0 01-2 2h-9.172a2 2 0 01-1.414-.586L3 12z" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Row 4 -->
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">0</button>
<button class="h-11 rounded-2xl bg-white/90 hover:bg-white text-lg shadow-sm border border-stone-200/40 flex items-center justify-center active:scale-95 transition-all" type="button">000</button>
<!-- Multi-record Quick Toggle -->
<button class="h-11 rounded-2xl bg-[#ece1cf] hover:bg-[#e4d6bf] text-stone-700 shadow-sm flex items-center justify-center active:scale-95 transition-all" title="Multi record sat-set" type="button">
<svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2.2" viewbox="0 0 24 24">
<path d="M9 5l7 7-7 7" stroke-linecap="round" stroke-linejoin="round"></path>
<path d="M4 12h12" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
<!-- Big Checkmark Submit Button -->
<button aria-label="Konfirmasi Transfer" class="h-11 rounded-2xl bg-[#665590] text-white shadow-md flex items-center justify-center active:scale-95 transition-all" type="button">
<svg class="w-6 h-6 stroke-current" fill="none" stroke-width="2.5" viewbox="0 0 24 24">
<path d="M5 13l4 4L19 7" stroke-linecap="round" stroke-linejoin="round"></path>
</svg>
</button>
</div>
<!-- Quick Ledger & Meta Tools (3 columns right side) -->
<div class="col-span-3 flex flex-col gap-2" data-purpose="quick-tools"><!-- Tanggal Button (Today) -->
<button class="h-11 px-2 rounded-2xl bg-[#d7f0fd] border border-sky-200/60 shadow-xs flex items-center justify-start gap-1.5 active:scale-95 transition-all text-left" type="button">
<span class="text-base">📅</span>
<div class="flex flex-col leading-none">
<span class="text-[9px] text-sky-800/70 font-semibold uppercase">Tgl</span>
<span class="text-[11px] font-bold text-sky-950 truncate">Hari Ini</span>
</div>
</button>
<!-- Biaya Admin -->
<button class="h-11 px-2 rounded-2xl bg-[#daf6ea] border border-emerald-100 shadow-xs flex items-center justify-start gap-1.5 active:scale-95 transition-all text-left" type="button">
<span class="text-base">✨</span>
<div class="flex flex-col leading-none">
<span class="text-[9px] text-emerald-800 font-semibold uppercase">Biaya</span>
<span class="text-[11px] font-bold text-emerald-800 truncate">Rp 0</span>
</div>
</button>
<!-- Buku Kas -->
<button class="h-11 px-2 rounded-2xl bg-[#faeed8] border border-amber-200/60 shadow-xs flex items-center justify-start gap-1.5 active:scale-95 transition-all text-left" type="button">
<span class="text-base">🧺</span>
<div class="flex flex-col leading-none">
<span class="text-[9px] text-amber-800/70 font-semibold uppercase">Buku</span>
<span class="text-[11px] font-bold text-amber-950 truncate">Pribadi</span>
</div>
</button>
<!-- Tag / Kategori Mutasi -->
<button class="h-11 px-2 rounded-2xl bg-[#f5e1f7] border border-purple-200/60 shadow-xs flex items-center justify-start gap-1.5 active:scale-95 transition-all text-left" type="button">
<span class="text-base">🏷️</span>
<div class="flex flex-col leading-none">
<span class="text-[9px] text-purple-800/70 font-semibold uppercase">Tag</span>
<span class="text-[11px] font-bold text-purple-950 truncate">Nabung</span>
</div>
</button></div>
</div>
<!-- iOS Home Indicator bar -->
<div class="w-32 h-1 bg-stone-700/80 rounded-full mx-auto mt-4" data-purpose="home-indicator"></div>
</div>

</main>
